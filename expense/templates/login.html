<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-container h2 {
      font-weight: 600;
      margin-bottom: 25px;
      text-align: center;
      color: #333;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 60px;
      height: 60px;
    }

    .form-label {
      font-weight: 500;
    }

    input.form-control {
      border-radius: 10px;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
    }

    .register-link a {
      text-decoration: none;
      color: #6c63ff;
      font-weight: 500;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="https://www.svgrepo.com/show/499831/target.svg" alt="Logo" />
    </div>

    <h2>Welcome Back</h2>

    <!-- Django messages -->
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          <strong>{{ m }}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <!-- Login Form -->
    <form method="post">
      {% csrf_token %}
      {% for f in form %}
        <div class="mb-3">
          <label class="form-label">{{ f.label_tag }}</label>
          {{ f }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-login">Login</button>
    </form>

    <div class="register-link">
      Don't have an account? <a href="{% url 'regiexpense' %}">Register</a>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
