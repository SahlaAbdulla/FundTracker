<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Manager</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

  <!-- Custom Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #7d93e6;
      min-height: 100vh;
    }

    .navbar {
      background: linear-gradient(90deg, #c78d8d, #4d7b91);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
      color: #0d6efd !important;
    }

    .nav-link {
      font-weight: 500;
      color: #495057 !important;
      transition: 0.3s ease;
    }

    .nav-link:hover {
      color: #0d6efd !important;
    }

    .nav-link.active {
      color: #0d6efd !important;
    }

    .alert {
      margin: 20px auto;
      width: 90%;
      max-width: 800px;
    }

    .logout-link {
      font-weight: 500;
      color: #dc3545 !important;
      text-decoration: none;
    }

    .logout-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">💸 ExpenseTracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link {% if request.path == '/summary/' %}active{% endif %}" href="{% url 'summaryexpense' %}">📊 Summary</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">💼 Expenses</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{% url 'listexpense' %}">All Expenses</a></li>
              <li><a class="dropdown-item" href="{% url 'addexpense' %}">Add Expense</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item disabled" href="#">Coming Soon</a></li>
            </ul>
          </li>

        </ul>

        <a href="{% url 'signout' %}" class="logout-link">🚪 Logout</a>
      </div>
    </div>
  </nav>

  <!-- Messages -->
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong>{{ m }}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <!-- Main Block -->
  <main>
    {% block main_block %}
    {% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
