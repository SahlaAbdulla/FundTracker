{%extends 'base.html' %}
{%block main_block%}
<div class="container ">
    {{categories}}

   <form action="">
    <select name="category" id="" onchange="this.form.submit()">
        <option value="all" {%if selected_categories == all %} selected {%endif%}>All</option>
        {%for cat in catogeries%}
    
        <option value="{{cat}}" {%if selected_categories == cat %} selected {%endif%}>{{cat}}</option>
        {%endfor%}
    </select>
   </form>
    
    <div class="row">
        <div class="col-4"></div>
        <div class="col-4">
            <form action="">
                <input type="text" class="form-control" name="search-text">
                <button type="submit">Search</button>
            </form>
        </div>
        <div class="col-4"></div>
    </div>

    <table class="table table-dark table-striped mt-3 rounded border border-3">

        <tr>
            <th>title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Payment method</th>
            <th>Priority</th>
            <th>Action</th>
            <th>Delete</th>
            <th>Update</th>
            </tr>
            {%for t in data%}
            
            <tr>

                <td>{{t.title}}</td>
                <td>{{t.amount}}</td>
                <td>{{t.category}}</td>
                <td>{{t.payment_method}}</td>
                <td>{{t.priority}}</td>
                <td><a href="{%url 'detailexpense' t.id%}">View</a></td>
                <td><a href="{%url 'deleteexpense' t.id%}">Delete</a></td>
                <td><a href="{%url 'editexpense' t.id%}">Edit</a></td>
            </tr>

        {%endfor%}

    </table>

</div>
<a href="http://127.0.0.1:8000/">Back</a>
<a href="http://127.0.0.1:8000/expense/add/">Add</a>
{%endblock%}
