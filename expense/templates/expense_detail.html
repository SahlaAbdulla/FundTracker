<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Detail</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #e0f7ec);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .card-detail {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 600px;
    }

    .card-detail h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .back-btn {
      margin-top: 30px;
      display: inline-block;
      background: #0d6efd;
      color: white;
      padding: 10px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background-color: #084298;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card-detail">
    <h2 class="text-center mb-4">📄 Expense Detail</h2>

    <h2>📝 Title: {{ data.title }}</h2>
    <h2>💰 Amount: ₹ {{ data.amount }}</h2>
    <h2>🏷️ Category: {{ data.category }}</h2>
    <h2>💳 Payment Method: {{ data.payment_method }}</h2>
    <h2>⚡ Priority: {{ data.priority }}</h2>

    <div class="text-center">
      <a href="{% url 'listexpense' %}" class="back-btn">⬅️ Back to List</a>
    </div>
  </div>

</body>
</html>
